name: combine

# Turn whatever is committed under `rooms/` into the single binary Hydra
# loads, and publish it where the client can fetch it: a `latest` release,
# replaced each run, plus every push kept as a build artifact for a few
# weeks.
#
# This is the one step of the pipeline safe to run unattended: it is a pure,
# deterministic build over data a person has already put in `main` --
# whether that arrived via a `convert.yml` PR someone reviewed and merged,
# or a hand edit to a room file. It never touches upstream and never decides
# what the map should say, which is why it can trigger on every push to
# `rooms/**` while `convert.yml` (plan/21's mapdb is still being designed;
# `rooms/` holds hand-authored content upstream doesn't have) stays
# manual-only and proposes a PR instead of merging anything itself.
on:
  push:
    branches: [main]
    paths:
      - 'rooms/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Combine the committed room files into one binary
        run: cargo run --release -p cena-map-combine -- rooms hydra.map

      - name: Record what this binary was built from
        run: |
          {
            echo "upstream updated_at: $(cat rooms/upstream_updated_at 2>/dev/null || echo unknown)"
            echo "combined:            $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit:              ${{ github.sha }}"
          } > hydra.map.txt
          cat hydra.map.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-map
          path: |
            hydra.map
            hydra.map.txt
          retention-days: 30

      # `latest` is replaced each run rather than accumulating a release per
      # commit: the client always wants the newest map, not a specific
      # historical one, and `plan/21` records no case yet where a player
      # needs to pin an older map.
      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest map
          body_path: hydra.map.txt
          files: |
            hydra.map
            hydra.map.txt
          make_latest: true
