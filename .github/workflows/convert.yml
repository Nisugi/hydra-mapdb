name: convert

# Download the upstream mapdb and convert it, for review -- **not** for
# automatic merge. `rooms/` is not pure derived output any more: the mapdb
# is still being designed (`plan/21` in Cena), and it will hold hand-authored
# additions upstream never had (floors, layout, room identification, and
# whatever else the design settles on). A bot that regenerates and commits
# 36,838 files from upstream on a schedule would happily overwrite that.
#
# So this workflow only ever proposes a diff -- as a pull request, opened
# against a scratch branch it also owns -- and a person merges it (or edits
# it, or closes it) by hand. Nothing here pushes to `main`.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Convert even if data/updated_at looks unchanged'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream's updated_at before downloading 42 MB
        id: freshness
        run: |
          curl -sSL -o upstream_updated_at \
            https://raw.githubusercontent.com/FarFigNewGut/lich-mapdb-room/main/data/updated_at
          echo "upstream: $(cat upstream_updated_at)"
          if [ -f rooms/upstream_updated_at ] && \
             [ "${{ inputs.force }}" != "true" ] && \
             diff -q upstream_updated_at rooms/upstream_updated_at > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the upstream map
        if: steps.freshness.outputs.changed == 'true'
        run: |
          curl -sSL -o upstream_map.json \
            https://raw.githubusercontent.com/FarFigNewGut/lich-mapdb-room/main/data/map.json
          ls -la upstream_map.json

      - uses: dtolnay/rust-toolchain@stable
        if: steps.freshness.outputs.changed == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.freshness.outputs.changed == 'true'

      - name: Convert
        if: steps.freshness.outputs.changed == 'true'
        id: convert
        run: |
          cargo run --release -p cena-mapdb-convert -- upstream_map.json rooms
          cp upstream_updated_at rooms/upstream_updated_at
          echo "as-of=$(cat rooms/upstream_updated_at)" >> "$GITHUB_OUTPUT"

      # A conversion overwrites every room file from upstream, which would
      # drop the corrections people submitted -- they live in `corrections/`
      # precisely so a refresh cannot lose them, but the re-application has to
      # actually happen. Doing it before the ratchet and the PR means the diff
      # a reviewer sees is the one that would really be committed.
      - name: Re-apply accepted corrections over the fresh conversion
        if: steps.freshness.outputs.changed == 'true'
        run: cargo run --release -p cena-corrections --bin apply -- . rooms

      # The ratchet is a real check here, not just a local dev habit: it is
      # what notices upstream added a scripted crossing this repo has never
      # ported (`crates/mapdb-convert/tests/ratchet.rs`). A rise fails the
      # job and prints which shape is new; a fall (someone ported one) fails
      # too, until `unported.baseline` is turned down to match -- so the
      # workflow itself enforces "the ratchet only turns one way", not just
      # a person remembering to run it. It gates the PR below: a conversion
      # that regresses the ratchet is not offered for review at all.
      - name: Ratchet the conversion against the freshly downloaded map
        if: steps.freshness.outputs.changed == 'true'
        env:
          CENA_MAPDB: ${{ github.workspace }}/upstream_map.json
        run: cargo test --release -p cena-mapdb-convert --test ratchet -- --nocapture

      # A PR, not a push to main and not a bare artifact: GitHub's own diff
      # view is what lets a person see exactly which rooms changed against
      # hand-authored `rooms/` content before any of it lands, the same way
      # any other change here would be reviewed.
      - name: Open a PR with the converted diff
        if: steps.freshness.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: rooms/
          commit-message: "Convert: upstream mapdb as of ${{ steps.convert.outputs.as-of }}"
          branch: convert/upstream-update
          delete-branch: true
          title: "Convert: upstream mapdb as of ${{ steps.convert.outputs.as-of }}"
          body: |
            Converted from `FarFigNewGut/lich-mapdb-room`'s `data/map.json`
            (upstream `data/updated_at`: ${{ steps.convert.outputs.as-of }}).

            **Review before merging.** `rooms/` holds hand-authored additions
            this conversion does not know about; check the diff for anything
            that looks like it overwrote one rather than tracking an upstream
            change.

      - name: Upload the residue report
        if: steps.freshness.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: convert-report
          path: rooms/report/
          if-no-files-found: ignore
