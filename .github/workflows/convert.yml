name: convert

# Download the upstream mapdb and turn it into the per-room JSON this repo
# commits. Room files are one room per file (`crates/mapdb-convert/src/
# output.rs`), so a weekly upstream update is a small, reviewable diff --
# that diff, committed here, is this workflow's product. The `combine`
# workflow turns whatever is committed into the client's binary separately.
#
# Runs weekly and on demand. Not on push: nothing in this repo changing is a
# reason to re-download: only upstream changing is, and only the schedule (or
# a person) knows when that happened.
on:
  schedule:
    # Wednesdays, 09:00 UTC. No significance to the day; just off the hour
    # and away from any midnight-UTC pile-up on GitHub's shared runners.
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      force:
        description: 'Convert even if data/updated_at looks unchanged'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream's updated_at before downloading 42 MB
        id: freshness
        run: |
          curl -sSL -o upstream_updated_at \
            https://raw.githubusercontent.com/FarFigNewGut/lich-mapdb-room/main/data/updated_at
          echo "upstream: $(cat upstream_updated_at)"
          if [ -f rooms/upstream_updated_at ] && \
             [ "${{ inputs.force }}" != "true" ] && \
             diff -q upstream_updated_at rooms/upstream_updated_at > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the upstream map
        if: steps.freshness.outputs.changed == 'true'
        run: |
          curl -sSL -o upstream_map.json \
            https://raw.githubusercontent.com/FarFigNewGut/lich-mapdb-room/main/data/map.json
          ls -la upstream_map.json

      - uses: dtolnay/rust-toolchain@stable
        if: steps.freshness.outputs.changed == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.freshness.outputs.changed == 'true'

      - name: Convert
        if: steps.freshness.outputs.changed == 'true'
        run: |
          cargo run --release -p cena-mapdb-convert -- upstream_map.json rooms
          cp upstream_updated_at rooms/upstream_updated_at

      # The ratchet is a real check here, not just a local dev habit: it is
      # what notices upstream added a scripted crossing this repo has never
      # ported (`crates/mapdb-convert/tests/ratchet.rs`). A rise fails the
      # job and prints which shape is new; a fall (someone ported one) fails
      # too, until `unported.baseline` is turned down to match -- so the
      # workflow itself enforces "the ratchet only turns one way", not just
      # a person remembering to run it.
      - name: Ratchet the conversion against the freshly downloaded map
        if: steps.freshness.outputs.changed == 'true'
        env:
          CENA_MAPDB: ${{ github.workspace }}/upstream_map.json
        run: cargo test --release -p cena-mapdb-convert --test ratchet -- --nocapture

      - name: Commit the per-room diff
        if: steps.freshness.outputs.changed == 'true'
        run: |
          git config user.name "hydra-mapdb bot"
          git config user.email "actions@github.com"
          git add rooms/
          if git diff --cached --quiet; then
            echo "converted output is unchanged; nothing to commit"
          else
            git commit -m "Convert: upstream mapdb as of $(cat rooms/upstream_updated_at)"
            git push
          fi

      - name: Upload the residue report
        if: steps.freshness.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: convert-report
          path: rooms/report/
          if-no-files-found: ignore
